<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampuSync — AIT Pune Peer-to-Peer Rental, Marketplace & Skill-Barter</title>
    <meta name="description" content="Hyper-local peer-to-peer campus rental, secondhand gear, and skill-barter platform strictly for verified @aitpune.edu.in students." />
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-500 selection:text-white min-h-screen">
    <script>
      // Automatic seamless forward to pre-built production app when opened statically
      if (!window.location.port || window.location.port === "8000" || window.location.protocol === "file:") {
        window.location.replace("./dist/index.html" + window.location.search + window.location.hash);
      }
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=./dist/index.html">
    </noscript>
    <!-- Top-Left Floating Back Navigation Button -->
    <aside style="position: fixed; top: 14px; left: 16px; z-index: 9999; display: flex; align-items: center; gap: 8px;">
      <button onclick="if(window.history.length>1){window.history.back();}else{window.location.href='../homepage/homepage.html';}" style="display: inline-flex; align-items: center; gap: 7px; padding: 7px 16px; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #1d4ed8; border: 1px solid rgba(191, 219, 254, 0.9); border-radius: 9999px; font-size: 13px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1); transition: all 0.2s;" onmouseover="this.style.background='#eff6ff'; this.style.transform='translateY(-1px)';" onmouseout="this.style.background='rgba(255, 255, 255, 0.96)'; this.style.transform='none';">
        <span style="font-size: 14px;">←</span>
        <span>Back to Campus Connect</span>
      </button>
    </aside>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
