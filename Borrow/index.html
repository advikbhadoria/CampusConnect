<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusSync — AIT Pune Peer-to-Peer Rental, Marketplace & Skill-Barter</title>
    <meta name="description" content="Hyper-local peer-to-peer campus rental, secondhand gear, and skill-barter platform strictly for verified @aitpune.edu.in students." />
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-500 selection:text-white min-h-screen">
    <script>
      // Automatic seamless forward to pre-built production app when opened statically
      if (!window.location.port || window.location.port === "8000" || window.location.protocol === "file:") {
        window.location.replace("./dist/index.html" + window.location.search + window.location.hash);
      }
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=./dist/index.html">
    </noscript>
    <!-- Campus Connect Universal Portal Header Strip -->
    <header style="background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #f8fafc; padding: 6px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(226, 232, 240, 0.12); position: relative; z-index: 50; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button onclick="if(window.history.length>1){window.history.back();}else{window.location.href='../homepage/homepage.html';}" style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 12px; background: rgba(255, 255, 255, 0.14); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 9999px; font-size: 11.5px; font-weight: 700; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='rgba(255, 255, 255, 0.25)'" onmouseout="this.style.background='rgba(255, 255, 255, 0.14)'">
          <span style="font-size: 12px;">←</span>
          <span>Back</span>
        </button>
        <span style="font-size: 11px; color: #94a3b8; font-weight: 600;">Campus Connect · AIT Pune</span>
      </div>
      <a href="/homepage/homepage.html" style="font-size: 11.5px; color: #38bdf8; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
        <span>Home</span>
        <span style="font-size: 10px;">↗</span>
      </a>
    </header>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
