<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230B5D5B'/><text x='50' y='65' font-size='42' font-family='sans-serif' font-weight='bold' fill='%23FFCB3D' text-anchor='middle'>AIT</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIT Complaint Register</title>
    <meta name="description" content="Campus complaints register for Army Institute of Technology, Pune." />
    <!-- Google Fonts: Bricolage Grotesque (500), Hanken Grotesk (400, 500), Courier Prime -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500&family=Hanken+Grotesk:wght@400;500&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-mist text-ink font-body antialiased selection:bg-yellow selection:text-ink min-h-screen">
    <script>
      // Automatic seamless forward to pre-built production app when opened directly from source root
      if (!window.location.pathname.includes('/dist/')) {
        window.location.replace("/Complain/dist/index.html" + window.location.search + window.location.hash);
      }
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/Complain/dist/index.html">
    </noscript>
    <!-- Campus Connect Universal Portal Header Strip -->
    <header style="background: rgba(15, 23, 42, 0.96); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #f8fafc; padding: 6px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(226, 232, 240, 0.12); position: relative; z-index: 50; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <button onclick="if(window.history.length>1){window.history.back();}else{window.location.href='/homepage/homepage.html';}" style="display: inline-flex; align-items: center; gap: 5px; padding: 3px 12px; background: rgba(255, 255, 255, 0.14); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 9999px; font-size: 11.5px; font-weight: 700; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='rgba(255, 255, 255, 0.25)'" onmouseout="this.style.background='rgba(255, 255, 255, 0.14)'">
          <span style="font-size: 12px;">←</span>
          <span>Back</span>
        </button>
        <span style="font-size: 11px; color: #94a3b8; font-weight: 600;">Campus Connect · AIT Pune</span>
      </div>
      <a href="/homepage/homepage.html" style="font-size: 11.5px; color: #38bdf8; text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 4px;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
        <span>Home</span>
        <span style="font-size: 10px;">↗</span>
      </a>
    </header>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
